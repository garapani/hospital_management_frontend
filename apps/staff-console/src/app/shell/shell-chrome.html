<div class="flex min-h-screen relative overflow-hidden">
  <!-- Sidebar -->
  <aside
    class="flex w-64 shrink-0 flex-col bg-white border-r border-slate-200 shadow-sm px-4 py-6 text-slate-800 z-20 relative"
  >
    <div class="mb-7 flex items-center gap-2.5 px-3">
      <span
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white shadow-sm"
      >
        <i class="pi pi-plus text-sm font-bold"></i>
      </span>
      <span class="text-lg font-bold tracking-tight text-slate-900">MediCare OS</span>
    </div>
    <nav class="flex flex-col gap-1">
      <ng-content select="[shellNav]"></ng-content>
    </nav>
    <div class="mt-auto pt-4 border-t border-slate-200">
      <button (click)="logout()" class="nav-item w-full">
        <i class="pi pi-sign-out text-base"></i>
        Logout
      </button>
    </div>
  </aside>
  
  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col relative z-10">
    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
      <!-- Left: Breadcrumb & Page Title -->
      <div class="flex items-center gap-4 flex-1">
        <div class="flex items-center gap-2 text-sm text-slate-500">
          <a routerLink="/" class="hover:text-slate-700 transition-colors">
            <i class="pi pi-home"></i>
          </a>
          @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
            <span class="text-slate-300">/</span>
            @if (last) {
              <span class="font-semibold text-slate-700">{{ crumb.label }}</span>
            } @else {
              <a [routerLink]="crumb.link" class="hover:text-slate-700 transition-colors">{{ crumb.label }}</a>
            }
          }
        </div>
      </div>
      
      <!-- Center: Global Search -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <input
            type="text"
            placeholder="Search... (Ctrl+K)"
            class="w-64 pl-10 pr-4 py-2 rounded-full bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50"
            (focus)="searchFocused.set(true)"
            (blur)="searchFocused.set(false)"
            #searchInput
          />
          <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <!-- Right: Actions & User Menu -->
      <div class="flex items-center gap-3">
        <!-- Notifications -->
        <button 
          class="relative p-2 rounded-full hover:bg-slate-100 transition-colors"
          (click)="toggleNotifications()"
        >
          <i class="pi pi-bell text-slate-600"></i>
          @if (unreadCount() > 0) {
            <span class="absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-semibold">
              {{ unreadCount() }}
            </span>
          }
        </button>
        
        <!-- Quick Actions -->
        <button 
          class="p-2 rounded-full hover:bg-slate-100 transition-colors"
          pTooltip="Quick Actions"
          tooltipPosition="bottom"
          (click)="toggleQuickActions()"
        >
          <i class="pi pi-plus-circle text-slate-600"></i>
        </button>
        
        <!-- User Profile Dropdown -->
        <div class="relative">
          <button 
            class="flex items-center gap-2 p-2 rounded-full hover:bg-slate-100 transition-colors"
            (click)="toggleUserMenu()"
          >
            <div class="w-8 h-8 rounded-full accent-bg flex items-center justify-center text-white font-semibold text-sm">
              {{ userInitials() }}
            </div>
            <i class="pi pi-chevron-down text-xs text-slate-500"></i>
          </button>
          
          @if (userMenuOpen()) {
            <div class="absolute right-0 mt-2 w-56 surface-panel rounded-xl shadow-lg border border-slate-200 py-2 z-50">
              <div class="px-4 py-3 border-b border-slate-200">
                <p class="text-sm font-semibold text-slate-800">{{ currentUser()?.roles?.[0] || 'Admin User' }}</p>
                <p class="text-xs text-slate-500">{{ currentUser()?.hospitalId || 'admin@medicare.os' }}</p>
              </div>
              <a routerLink="/admin/profile" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 transition-colors">
                <i class="pi pi-user text-sm"></i>
                My Profile
              </a>
              <a routerLink="/admin/settings" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 transition-colors">
                <i class="pi pi-cog text-sm"></i>
                Settings
              </a>
              <div class="border-t border-slate-200 my-2"></div>
              <button
                (click)="logout()"
                class="flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 w-full transition-colors"
              >
                <i class="pi pi-sign-out text-sm"></i>
                Logout
              </button>
            </div>
          }
        </div>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
