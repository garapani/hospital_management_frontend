<p-toast></p-toast>
<div class="flex flex-col gap-6">
  <div class="surface-panel p-6 flex flex-col gap-6">
    <div>
      <h1 class="page-title">Invoices</h1>
      <p class="page-subtitle">Filter invoices by patient</p>
    </div>

    <div class="flex items-end gap-3 flex-wrap">
      <label for="invoicePatientFilter" class="flex flex-col gap-2">
        <span class="text-sm font-medium text-slate-700">Patient</span>
        <p-select
          inputId="invoicePatientFilter"
          [options]="patientOptions()"
          [ngModel]="patientIdFilter()"
          (ngModelChange)="patientIdFilter.set($event)"
          [filter]="true"
          (onFilter)="onPatientFilterSearch($event.filter)"
          [loading]="patientSearching()"
          filterPlaceholder="Search by name, number or phone"
          emptyFilterMessage="Type at least 2 characters to search"
          placeholder="Search for a patient"
          [showClear]="true"
          styleClass="w-64"
        ></p-select>
      </label>
      <p-button
        label="Filter"
        (onClick)="applyPatientFilter()"
        styleClass="accent-bg rounded-lg border-none shadow-md px-6"
      />
    </div>
  </div>

  <div class="surface-panel overflow-hidden">
    <p-table
      [value]="invoices()"
      [lazy]="true"
      [lazyLoadOnInit]="false"
      (onLazyLoad)="onLazyLoad($event)"
      [paginator]="true"
      [rows]="pageSize()"
      [first]="firstRecord()"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      dataKey="id"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="table-header-cell">
            Reference
          </th>
          <th class="table-header-cell">
            Patient ID
          </th>
          <th class="table-header-cell">
            Total
          </th>
          <th class="table-header-cell">
            Paid
          </th>
          <th class="table-header-cell">
            Status
          </th>
          <th class="table-header-cell">
            Updated
          </th>
          <th
            class="table-header-cell"
          ></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-invoice>
        <tr
          class="hover:bg-slate-100 transition-colors"
          [class]="'status-rail-' + statusSeverity(invoice.status)"
        >
          <td class="font-mono font-semibold text-slate-700 border-b border-slate-200">
            {{ reference(invoice) }}
          </td>
          <td class="border-b border-slate-200">
            <a [routerLink]="['/clinical/patients', invoice.patientId]" class="text-sky-600 hover:text-sky-800">
              <hms-entity-name type="patient" [id]="invoice.patientId"></hms-entity-name>
            </a>
          </td>
          <td class="font-mono font-medium text-slate-700 border-b border-slate-200">
            {{ invoice.totalAmount | number: '1.2-2' }}
          </td>
          <td class="font-mono text-slate-600 border-b border-slate-200">
            {{ invoice.paidAmount | number: '1.2-2' }}
          </td>
          <td class="border-b border-slate-200">
            <p-tag
              [value]="invoice.status"
              [severity]="statusSeverity(invoice.status)"
              styleClass="rounded-full px-3"
            />
          </td>
          <td class="text-slate-600 border-b border-slate-200">
            {{ invoice.updatedAt | date: 'short' }}
          </td>
          <td class="border-b border-slate-200">
            <a
              [routerLink]="['/billing/invoices', invoice.id]"
              class="text-sm font-semibold accent-text hover:opacity-80"
              >View</a
            >
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="py-8 text-center text-sm text-slate-500">
            No invoices found.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
