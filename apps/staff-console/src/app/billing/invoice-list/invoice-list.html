<div class="flex flex-col gap-6">
  <div class="glass-panel p-6 flex flex-col gap-6">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Invoices</h1>
      <p class="text-sm text-slate-500 mt-1">Filter invoices by patient ID</p>
    </div>

    <div class="flex items-end gap-3">
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-slate-700">Patient ID</span>
        <input
          pInputText
          [ngModel]="patientIdFilter()"
          (ngModelChange)="patientIdFilter.set($event)"
          (keyup.enter)="applyPatientFilter()"
          placeholder="Filter by patient ID"
          class="w-64 bg-white/60 border-white/50 backdrop-blur-sm rounded-lg"
        />
      </label>
      <p-button
        label="Filter"
        (onClick)="applyPatientFilter()"
        styleClass="gradient-bg rounded-lg border-none shadow-md px-6"
      />
    </div>
  </div>

  <div class="glass-panel overflow-hidden">
    <p-table
      [value]="invoices()"
      [lazy]="true"
      [lazyLoadOnInit]="false"
      (onLazyLoad)="onLazyLoad($event)"
      [paginator]="true"
      [rows]="pageSize()"
      [first]="firstRecord()"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      dataKey="id"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="table-header-cell">
            Reference
          </th>
          <th class="table-header-cell">
            Patient ID
          </th>
          <th class="table-header-cell">
            Total
          </th>
          <th class="table-header-cell">
            Paid
          </th>
          <th class="table-header-cell">
            Status
          </th>
          <th class="table-header-cell">
            Updated
          </th>
          <th
            class="table-header-cell"
          ></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-invoice>
        <tr class="hover:bg-white/40 transition-colors">
          <td class="font-semibold text-slate-700 border-b border-white/30">
            {{ reference(invoice) }}
          </td>
          <td class="text-slate-600 border-b border-white/30">
            {{ invoice.patientId }}
          </td>
          <td class="font-medium text-slate-700 border-b border-white/30">
            {{ invoice.totalAmount | number: '1.2-2' }}
          </td>
          <td class="text-slate-600 border-b border-white/30">
            {{ invoice.paidAmount | number: '1.2-2' }}
          </td>
          <td class="border-b border-white/30">
            <p-tag
              [value]="invoice.status"
              [severity]="statusSeverity(invoice.status)"
              styleClass="rounded-full px-3"
            />
          </td>
          <td class="text-slate-600 border-b border-white/30">
            {{ invoice.updatedAt | date: 'short' }}
          </td>
          <td class="border-b border-white/30">
            <a
              [routerLink]="['/billing/invoices', invoice.id]"
              class="text-sm font-semibold gradient-text hover:opacity-80"
              >View</a
            >
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="py-8 text-center text-sm text-slate-500">
            No invoices found.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
