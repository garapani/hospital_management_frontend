<div class="flex flex-col gap-4">
  <div>
    <h1 class="text-xl font-semibold text-surface-900">Invoices</h1>
    <p class="text-sm text-surface-600">Filter invoices by patient ID</p>
  </div>

  <div class="flex items-end gap-2">
    <label class="flex flex-col gap-1">
      <span class="text-sm text-surface-700">Patient ID</span>
      <input
        pInputText
        [ngModel]="patientIdFilter()"
        (ngModelChange)="patientIdFilter.set($event)"
        (keyup.enter)="applyPatientFilter()"
        placeholder="Filter by patient ID"
      />
    </label>
    <p-button label="Filter" (onClick)="applyPatientFilter()" />
  </div>

  <p-table
    [value]="invoices()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="pageSize()"
    [first]="firstRecord()"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Reference</th>
        <th>Patient ID</th>
        <th>Total</th>
        <th>Paid</th>
        <th>Status</th>
        <th>Updated</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-invoice>
      <tr>
        <td>{{ reference(invoice) }}</td>
        <td>{{ invoice.patientId }}</td>
        <td>{{ invoice.totalAmount | number: '1.2-2' }}</td>
        <td>{{ invoice.paidAmount | number: '1.2-2' }}</td>
        <td><p-tag [value]="invoice.status" [severity]="statusSeverity(invoice.status)" /></td>
        <td>{{ invoice.updatedAt | date: 'short' }}</td>
        <td><a [routerLink]="['/billing/invoices', invoice.id]">View</a></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7">No invoices found.</td></tr>
    </ng-template>
  </p-table>
</div>
